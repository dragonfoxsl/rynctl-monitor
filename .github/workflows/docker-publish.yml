name: Build and Publish Docker Image

on:
  push:
    tags: ['v*']

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  test:
    runs-on: ubuntu-24.04
    env:
      RYNCTL_SECRET: release-ci-test-secret-0123456789abcdef
      RYNCTL_ADMIN_PASSWORD: CiTestOnly123!
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            tests/package-lock.json
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - name: Install system deps
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends rsync openssh-client
      - name: Install Python deps
        run: pip install -r requirements-dev.txt
      - name: Audit Python deps
        run: |
          pip install pip-audit
          pip-audit -r requirements.txt -r requirements-dev.txt
      - name: Run backend unit tests
        run: pytest
      - name: Audit and build frontend
        working-directory: frontend
        run: |
          npm ci --legacy-peer-deps
          npm audit --audit-level=high
          npm run build
      - name: Audit e2e package
        working-directory: tests
        run: |
          npm ci
          npm audit --audit-level=high
      - name: Resolve Playwright version from tests/package.json
        run: |
          echo "PLAYWRIGHT_VERSION=$(sed -n 's/.*"@playwright\/test": *"\([^"]*\)".*/\1/p' tests/package.json)" >> "$GITHUB_ENV"
      - name: Run browser + API suite in Docker
        run: |
          docker compose up -d --wait rynctl-monitor
          docker compose --profile tools build e2e-tests
          docker compose exec -T -u 10001 rynctl-monitor sh -lc 'rm -rf /tmp/rynctl-scheduler-src /tmp/rynctl-scheduler-dst && mkdir -p /tmp/rynctl-scheduler-src /tmp/rynctl-scheduler-dst && printf scheduler-proof > /tmp/rynctl-scheduler-src/proof.txt'
          docker compose --profile tools run --rm --no-deps e2e-tests
          docker compose exec -T rynctl-monitor sh -lc 'test "$(cat /tmp/rynctl-scheduler-dst/proof.txt)" = "scheduler-proof"'
      - name: Tear down
        if: always()
        run: docker compose down -v || true

  build-and-push:
    needs: test
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - name: Build and push Docker image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
