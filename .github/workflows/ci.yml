name: CI

on:
  schedule:
    - cron: "0 3 * * 5"
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend deps
        run: npm ci --legacy-peer-deps
      - name: Audit frontend deps
        run: npm audit --audit-level=high
      - name: Build frontend
        run: npm run build

  e2e-package-audit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: tests/package-lock.json
      - name: Install e2e deps
        run: npm ci
      - name: Audit e2e deps
        run: npm audit --audit-level=high

  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install system deps
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends rsync openssh-client
      - name: Install Python deps
        run: pip install -r requirements-dev.txt
      - name: Run backend unit tests
        run: pytest

  e2e-tests:
    needs: [frontend, e2e-package-audit, backend-tests]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check Playwright package and image versions match
        run: |
          pkg=$(node -p "require('./tests/package.json').devDependencies['@playwright/test']")
          img=$(grep -oP 'mcr\.microsoft\.com/playwright:v\K[0-9.]+' Dockerfile.test)
          echo "package @playwright/test=$pkg  image=$img"
          if [ "$pkg" != "$img" ]; then
            echo "::error::Playwright version drift: tests/package.json=$pkg but Dockerfile.test image=$img. Bump the image tag in Dockerfile.test to match."
            exit 1
          fi
      - name: Run browser + API suite in Docker
        run: |
          docker compose up -d rynctl-monitor
          docker compose exec -T -u 10001 rynctl-monitor sh -lc 'rm -rf /tmp/rynctl-scheduler-src /tmp/rynctl-scheduler-dst && mkdir -p /tmp/rynctl-scheduler-src /tmp/rynctl-scheduler-dst && printf scheduler-proof > /tmp/rynctl-scheduler-src/proof.txt'
          docker compose --profile tools build e2e-tests
          docker compose --profile tools run --rm e2e-tests
          docker compose exec -T rynctl-monitor sh -lc 'test "$(cat /tmp/rynctl-scheduler-dst/proof.txt)" = "scheduler-proof"'
      - name: Tear down
        if: always()
        run: docker compose down -v || true
