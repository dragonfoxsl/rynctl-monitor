name: CI

on:
  schedule:
    - cron: "0 3 * * 5"
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend deps
        run: npm ci --legacy-peer-deps
      - name: Audit frontend deps
        run: npm audit --audit-level=high
      - name: Build frontend
        run: npm run build

  e2e-package-audit:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: tests
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: tests/package-lock.json
      - name: Install e2e deps
        run: npm ci
      - name: Audit e2e deps
        run: npm audit --audit-level=high

  backend-tests:
    runs-on: ubuntu-24.04
    env:
      RYNCTL_SECRET: backend-ci-test-secret-0123456789abcdef
      RYNCTL_ADMIN_PASSWORD: CiTestOnly123!
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - name: Install system deps
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends rsync openssh-client
      - name: Install Python deps
        run: pip install -r requirements-dev.txt
      - name: Audit Python deps
        run: |
          pip install pip-audit
          pip-audit -r requirements.txt -r requirements-dev.txt
      - name: Run backend unit tests
        run: pytest

  e2e-tests:
    needs: [frontend, e2e-package-audit, backend-tests]
    runs-on: ubuntu-24.04
    env:
      RYNCTL_SECRET: e2e-ci-test-secret-0123456789abcdef
      RYNCTL_ADMIN_PASSWORD: CiTestOnly123!
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Resolve Playwright version from tests/package.json
        run: |
          echo "PLAYWRIGHT_VERSION=$(sed -n 's/.*"@playwright\/test": *"\([^"]*\)".*/\1/p' tests/package.json)" >> "$GITHUB_ENV"
      - name: Run browser + API suite in Docker
        run: |
          docker compose up -d --wait rynctl-monitor
          docker compose --profile tools build e2e-tests
          docker compose exec -T -u 10001 rynctl-monitor sh -lc 'rm -rf /tmp/rynctl-scheduler-src /tmp/rynctl-scheduler-dst && mkdir -p /tmp/rynctl-scheduler-src /tmp/rynctl-scheduler-dst && printf scheduler-proof > /tmp/rynctl-scheduler-src/proof.txt'
          docker compose --profile tools run --rm --no-deps e2e-tests
          docker compose exec -T rynctl-monitor sh -lc 'test "$(cat /tmp/rynctl-scheduler-dst/proof.txt)" = "scheduler-proof"'
      - name: Tear down
        if: always()
        run: docker compose down -v || true
